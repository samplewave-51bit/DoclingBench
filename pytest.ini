[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Fast unit tests without heavyweight model inference
    integration: Integration tests requiring model downloads or parsing
    slow: Tests that take longer than 10 seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
